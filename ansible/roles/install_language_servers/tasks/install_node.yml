- name: Determine NVM_DIR
  ansible.builtin.set_fact:
    nvm_dir: >-
      {{
        (ansible_facts['env'].XDG_CONFIG_HOME ~ '/nvm')
        if (ansible_facts['env'].XDG_CONFIG_HOME is defined)
        else (ansible_facts['user_dir'] ~ '/.nvm')
      }}

- name: Define nvm script path for convenience
  ansible.builtin.set_fact:
    nvm_script_path: "{{ nvm_dir }}/nvm.sh"

- name: Install NVM block
  block:
    - name: Create temporary downloads directory
      ansible.builtin.tempfile:
        state: directory
        suffix: downloads
      register: tempdir
      changed_when: false

    - name: Install NVM
      ansible.builtin.shell:
        cmd: curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v{{ nvm_version }}/install.sh | bash
      args:
        chdir: "{{ tempdir.path }}"
        creates: "{{ nvm_script_path }}"

  always:
    - name: Delete temporary downloads directory
      ansible.builtin.file:
        path: "{{ tempdir.path }}"
        state: absent
      changed_when: false

- name: Install Node.JS
  ansible.builtin.shell:
    cmd: "source {{ nvm_script_path }} && nvm install node"
  args:
    executable: /bin/bash
    creates: "{{ ansible_facts['user_dir'] }}/.nvm/versions/node"
