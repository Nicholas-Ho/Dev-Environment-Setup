- name: Set up development environment
  hosts: dev_hosts
  tasks:
    - name: Setup vim
      include_role:
        name: vim_setup

    - name: Install packages
      include_role:
        name: install_packages

    - name: Install language servers
      include_role:
        name: install_language_servers

    - name: Set up bat themes
      include_role:
        name: setup_bat_themes

    - name: Set up .bashrc
      include_role:
        name: setup_bashrc
